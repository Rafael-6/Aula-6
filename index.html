<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios de CSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 0.5rem; }
    p { color: #64748b; margin-bottom: 2rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .card h2 { font-size: 1.25rem; color: #2563eb; margin-bottom: 0.5rem; }
    .card p { font-size: 0.9rem; margin: 0; }
  </style>
</head>
<body>

  <h1>Meus Exercícios de CSS</h1>
  <p>Selecione um dos projetos abaixo para visualizar:</p>

  <div class="grid">
    <a href="./Blog/blog.html" class="card">
      <h2>Exercício 1</h2>
      <p>Layout estruturado com Header, Main, Sidebar e Footer.</p>
    </a>

    <a href="./Cartao/cartao.html" class="card">
      <h2>Exercício 2</h2>
      <p>Cartões de Contato com RGBA, HSL e alinhamentos de texto.</p>
    </a>

    <a href="./Landing Page/page.html" class="card">
      <h2>Exercício 3</h2>
      <p>Landing Page com 5 cores, 2 Google Fonts e hover nos botões.</p>
    </a>
  </div>

</body>
</html>
